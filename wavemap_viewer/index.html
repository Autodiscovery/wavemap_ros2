<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wavemap Viewer</title>
  <meta name="description" content="3D web viewer for wavemap ROS 2 occupancy maps">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Connection Bar -->
  <header id="header">
    <div class="header-left">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Wavemap Viewer</span>
      </div>
      <div id="connection-status" class="status disconnected">
        <span class="status-dot"></span>
        <span class="status-text">Disconnected</span>
      </div>
    </div>
    <div class="header-center">
      <label for="ros-url">Bridge URL</label>
      <input type="text" id="ros-url" value="ws://localhost:9090" spellcheck="false">
      <button id="btn-connect" class="btn btn-primary">Connect</button>
    </div>
    <div class="header-right">
      <div id="point-count" class="stat">
        <span class="stat-label">Points</span>
        <span class="stat-value" id="stat-points">0</span>
      </div>
      <div id="fps-counter" class="stat">
        <span class="stat-label">FPS</span>
        <span class="stat-value" id="stat-fps">0</span>
      </div>
    </div>
  </header>

  <!-- Side Panel -->
  <aside id="sidebar">
    <section class="panel">
      <h3>Topics</h3>
      <div class="field">
        <label for="pointcloud-topic">Pointcloud Topic</label>
        <input type="text" id="pointcloud-topic" value="/wavemap/pointcloud" spellcheck="false">
      </div>
      <div class="field">
        <label for="map-topic">Map Topic</label>
        <input type="text" id="map-topic" value="/wavemap/map" spellcheck="false">
      </div>
      <button id="btn-subscribe" class="btn btn-secondary btn-full" disabled>Subscribe</button>
    </section>

    <section class="panel">
      <h3>Rendering</h3>
      <div class="field">
        <label for="point-size">Point Size</label>
        <input type="range" id="point-size" min="0.5" max="8" step="0.5" value="2">
        <span class="range-val" id="point-size-val">2.0</span>
      </div>
      <div class="field">
        <label for="color-mode">Color Mode</label>
        <select id="color-mode">
          <option value="height">Height</option>
          <option value="occupancy">Occupancy</option>
          <option value="solid">Solid Color</option>
        </select>
      </div>
      <div class="field">
        <label for="bg-color">Background</label>
        <select id="bg-color">
          <option value="dark" selected>Dark</option>
          <option value="midnight">Midnight</option>
          <option value="light">Light</option>
        </select>
      </div>
      <div class="field inline">
        <label>
          <input type="checkbox" id="show-grid" checked> Show Grid
        </label>
      </div>
      <div class="field inline">
        <label>
          <input type="checkbox" id="show-axes" checked> Show Axes
        </label>
      </div>
      <button id="btn-clear" class="btn btn-ghost btn-full">Clear Points</button>
    </section>

    <section class="panel">
      <h3>Map I/O</h3>
      <div class="field">
        <label for="save-path">Save Path</label>
        <input type="text" id="save-path" value="/tmp/wavemap_export.wvm" spellcheck="false">
      </div>
      <button id="btn-save" class="btn btn-accent btn-full" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save Map
      </button>
      <div class="field">
        <label for="load-path">Load Path</label>
        <input type="text" id="load-path" value="/tmp/wavemap_export.wvm" spellcheck="false">
      </div>
      <button id="btn-load" class="btn btn-secondary btn-full" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Load Map
      </button>
      <div id="io-status" class="io-status"></div>
    </section>

    <section class="panel">
      <h3>Camera</h3>
      <button id="btn-reset-cam" class="btn btn-ghost btn-full">Reset View</button>
      <button id="btn-top" class="btn btn-ghost btn-full">Top-Down</button>
      <button id="btn-front" class="btn btn-ghost btn-full">Front View</button>
    </section>
  </aside>

  <!-- 3D Canvas -->
  <main id="viewport">
    <canvas id="canvas3d"></canvas>
    <div id="toast-container"></div>
  </main>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/roslib@1.4.1/build/roslib.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
